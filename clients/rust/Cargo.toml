[package]
name = "nmdb-rs"
version = "0.1.0"
edition = "2021"
authors = ["Sintellix Contributors"]
description = "Rust client library for Neural Message Data Bus (NMDB)"
license = "MIT"
repository = "https://github.com/rand0mdevel0per/nmdb"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "basic_client"
path = "examples/basic_client.rs"
